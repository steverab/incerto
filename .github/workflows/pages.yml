name: Deploy Website and Documentation

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system sphinx sphinx-book-theme sphinx-autodoc-typehints sphinx-copybutton myst-parser
          uv pip install --system -e ".[all]"

      - name: Build Sphinx Documentation
        run: |
          cd docs
          sphinx-build -b html source build/html

      - name: Prepare publish directory
        run: |
          mkdir -p public
          # Copy landing page
          rsync -av --delete website/ public/
          # Copy Sphinx docs to public/docs/
          mkdir -p public/docs
          rsync -av --delete docs/build/html/ public/docs/

      - name: Add .nojekyll and CNAME
        run: |
          touch public/.nojekyll
          echo "incerto.dev" > public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
