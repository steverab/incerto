name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea in detail.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration with the current library?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like. Include example API usage if possible.
      placeholder: |
        I would like incerto to support...

        Example usage:
        ```python
        from incerto import NewFeature
        ```
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Related Module
      description: Which module is this feature related to?
      options:
        - Calibration
        - OOD Detection
        - Conformal Prediction
        - Selective Prediction
        - Bayesian Methods
        - Shift Detection
        - Active Learning
        - LLM Uncertainty
        - Data/Utilities
        - Other/New Module
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link to relevant papers, implementations, or documentation.
