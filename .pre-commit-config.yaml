# .pre-commit-config.yaml
repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0          # latest stable as of Jan 29 2025 :contentReference[oaicite:0]{index=0}
    hooks:
      - id: black
        # pick the interpreter your project targets
        language_version: python3.10
        # optional Black flags, e.g. line length:
        # args: ["--line-length", "100"]
