[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incerto"
version = "0.1.0"
description = "A library for uncertainty quantification in machine learning"
authors = [{ name="Stephan Rabanser", email="rabanser@princeton.edu" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "uncertainty",
    "calibration",
    "ood-detection",
    "conformal-prediction",
    "selective-prediction",
    "deep-learning",
    "pytorch",
    "machine-learning",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
vision = ["torchvision>=0.16"]
llm = [
    "transformers>=4.36",
    "accelerate>=0.25",
    "sentence-transformers>=2.2",
]
examples = [
    "rich>=13.0",
    "incerto[vision,llm]",
]
all = ["incerto[vision,llm]"]

[project.urls]
Homepage = "https://incerto.dev"
Documentation = "https://incerto.dev/docs/"
Repository = "https://github.com/steverab/incerto"
Issues = "https://github.com/steverab/incerto/issues"
Changelog = "https://github.com/steverab/incerto/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "build>=1.2.2.post1",
    "jupyter>=1.1.1",
    "linkify-it-py>=2.0",
    "myst-parser>=4.0.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0",
    "ruff>=0.11.10",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "twine>=6.1.0",
    "ty>=0.0.1a5",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["incerto*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
incerto = ["py.typed"]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"examples/*.ipynb" = ["E402"]
