[project]
name = "incerto"
version = "0.0.1"
description = "A library for uncertainty quantification in machine learning"
authors = [{ name="Stephan Rabanser", email="stephan@cs.toronto.edu" }]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "rich>=14.0.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "build>=1.2.2.post1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.10",
    "sphinx>=8.1.3",
    "twine>=6.1.0",
    "ty>=0.0.1a5",
]
