[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incerto"
version = "0.1.0"
description = "A library for uncertainty quantification in machine learning"
authors = [{ name="Stephan Rabanser", email="rabanser@princeton.edu" }]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "uncertainty",
    "calibration",
    "ood-detection",
    "conformal-prediction",
    "selective-prediction",
    "deep-learning",
    "pytorch",
    "machine-learning",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "accelerate>=1.10.1",
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "rich>=14.0.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.57.1",
]

[project.urls]
Homepage = "https://incerto.dev"
Documentation = "https://incerto.dev/docs/"
Repository = "https://github.com/steverab/incerto"
Issues = "https://github.com/steverab/incerto/issues"
Changelog = "https://github.com/steverab/incerto/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "build>=1.2.2.post1",
    "myst-parser>=4.0.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.10",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "twine>=6.1.0",
    "ty>=0.0.1a5",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["incerto*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
incerto = ["py.typed"]
