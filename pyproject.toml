[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incerto"
version = "0.1.1"
description = "A library for uncertainty quantification in machine learning"
authors = [{ name="Stephan Rabanser", email="rabanser@princeton.edu" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "uncertainty",
    "calibration",
    "ood-detection",
    "conformal-prediction",
    "selective-prediction",
    "deep-learning",
    "pytorch",
    "machine-learning",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
vision = ["torchvision>=0.16"]
llm = [
    "transformers>=4.36",
    "accelerate>=0.25",
    "sentence-transformers>=2.2",
]
examples = [
    "rich>=13.0",
    "incerto[vision,llm]",
]
all = ["incerto[vision,llm]"]

[project.urls]
Homepage = "https://incerto.dev"
Documentation = "https://incerto.dev/docs/"
Repository = "https://github.com/steverab/incerto"
Issues = "https://github.com/steverab/incerto/issues"
Changelog = "https://github.com/steverab/incerto/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "build>=1.2.2.post1",
    "jupyter>=1.1.1",
    "linkify-it-py>=2.0",
    "myst-parser>=4.0.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0",
    "ruff>=0.11.10",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "twine>=6.1.0",
    "ty>=0.0.1a5",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["incerto*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
incerto = ["py.typed"]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function calls in arg defaults (common in PyTorch)
    "B028",  # explicit stacklevel on warnings.warn
]

[tool.ruff.lint.per-file-ignores]
# Notebooks are pedagogical — relax style rules: imports mid-cell (E402),
# trailing whitespace from print output (W291/W293), unused loop variables
# in didactic for-loops (B007), and the wildcard exception nag for examples (B904).
"examples/*.ipynb" = ["E402", "W291", "W293", "B007", "B904"]
"tests/**/*.py" = ["B011", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["incerto"]

[tool.pyright]
include = ["incerto"]
exclude = ["**/__pycache__", "**/.venv", "tests", "examples", "docs"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
# torch's __all__ is incomplete (torch.log/zeros/tensor/cdist/etc. are not
# listed even though they're public). Suppress that noise outright.
reportPrivateImportUsage = "none"
# Remaining categories downgraded to warnings for v0.1 — the algorithms work
# correctly, but full strict type coverage is a v0.2 task. Warnings still
# show in the output without failing the CI job.
reportMissingImports = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportReturnType = "warning"
reportAttributeAccessIssue = "warning"
reportOperatorIssue = "warning"
reportCallIssue = "warning"
reportIndexIssue = "warning"
