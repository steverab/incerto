[pytest]
# Pytest configuration for incerto

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 8.0

# Add options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Enable strict markers
    --strict-markers
    # Show warnings
    -W default
    # Coverage options (if pytest-cov is installed)
    # --cov=incerto
    # --cov-report=html
    # --cov-report=term-missing

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_gpu: marks tests that require GPU
    requires_transformers: marks tests that require transformers library

# Ignore paths
norecursedirs =
    .git
    .venv
    __pycache__
    *.egg-info
    dist
    build
    docs
    .claude

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    # Ignore deprecation warnings from third-party dependencies
    ignore::DeprecationWarning:torch.*
    ignore::DeprecationWarning:numpy.*
    ignore::DeprecationWarning:sklearn.*
    ignore::PendingDeprecationWarning
    # Turn warnings into errors (uncomment for strict testing)
    # error

# Test execution order
console_output_style = progress

# Xfail behavior
xfail_strict = false
